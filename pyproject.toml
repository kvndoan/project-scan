[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-scan"
version = "0.1.0"
description = "Portable spatial mapping system using OAK-D Pro and visual-inertial SLAM"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "open3d==0.19.0",
    "spectacularai[oak,cli]==1.53.2",
]

[tool.setuptools.packages.find]
where = ["src"]